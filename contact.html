<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us — Travel Bloom</title>
  <link rel="stylesheet" href="styles.css">
  <script src="travel_recommendation.js" defer></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">✦ Travel Bloom</a>
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About Us</a><a href="contact.html" aria-current="page">Contact Us</a></nav>
  </header>
  <main class="page contact-layout">
    <div><p class="eyebrow">Let's talk travel</p><h1>Contact us.</h1><p class="lead">Have a destination in mind?<br>We would love to hear your ideas.</p></div>
    <form id="contact-form" class="panel contact-form">
      <h2>Leave a message</h2>
      <p>This practice form validates your details locally. It does not send email or save your message.</p>
      <label for="name">Name</label><input id="name" name="name" autocomplete="name" required maxlength="100">
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="message">Message</label><textarea id="message" name="message" rows="6" required maxlength="2000"></textarea>
      <button type="submit">Submit</button>
      <p id="contact-status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <footer>Travel Bloom · A JavaScript learning project</footer>
</body>
</html>
